<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nir Arazi — SOC Analyst header banner</title>
  <desc>Dark banner with name, title, and subtle cyber grid pattern</desc>

  <rect width="680" height="160" fill="#0d1117"/>

  <!-- Grid lines -->
  <g stroke="#1e2d3d" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="20" x2="680" y2="20"/>
    <line x1="0" y1="40" x2="680" y2="40"/>
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="100" x2="680" y2="100"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="140" x2="680" y2="140"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="240" y1="0" x2="240" y2="160"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="400" y1="0" x2="400" y2="160"/>
    <line x1="480" y1="0" x2="480" y2="160"/>
    <line x1="560" y1="0" x2="560" y2="160"/>
    <line x1="640" y1="0" x2="640" y2="160"/>
  </g>

  <!-- Accent bar left -->
  <rect x="40" y="48" width="3" height="64" fill="#238636" rx="1"/>

  <!-- Name -->
  <text x="58" y="88" font-family="monospace" font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="-1">Nir Arazi</text>

  <!-- Subtitle -->
  <text x="59" y="112" font-family="monospace" font-size="13" fill="#58a6ff" letter-spacing="2">SOC ANALYST  ·  THREAT DETECTION  ·  DFIR</text>

  <!-- Right side decorative dots -->
  <circle cx="590" cy="55" r="2" fill="#238636" opacity="0.8"/>
  <circle cx="602" cy="55" r="2" fill="#238636" opacity="0.5"/>
  <circle cx="614" cy="55" r="2" fill="#238636" opacity="0.3"/>

  <circle cx="590" cy="105" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="602" cy="105" r="2" fill="#58a6ff" opacity="0.5"/>
  <circle cx="614" cy="105" r="2" fill="#58a6ff" opacity="0.8"/>

  <!-- Corner bracket top-left -->
  <path d="M40 38 L40 30 L52 30" stroke="#238636" stroke-width="1.5" fill="none"/>
  <!-- Corner bracket bottom-right -->
  <path d="M640 122 L640 130 L628 130" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
</svg>
