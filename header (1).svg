<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nir Arazi — SOC Analyst animated header banner</title>
  <desc>Animated dark banner with matrix rain, scanning line, and typing effect</desc>

  <defs>
    <style>
      .rain { font-family: monospace; font-size: 11px; fill: #238636; }
      @keyframes drop1 { 0%{transform:translateY(-20px);opacity:0} 10%{opacity:0.7} 80%{opacity:0.5} 100%{transform:translateY(170px);opacity:0} }
      @keyframes drop2 { 0%{transform:translateY(-20px);opacity:0} 15%{opacity:0.5} 80%{opacity:0.3} 100%{transform:translateY(170px);opacity:0} }
      @keyframes drop3 { 0%{transform:translateY(-20px);opacity:0} 20%{opacity:0.6} 80%{opacity:0.4} 100%{transform:translateY(170px);opacity:0} }
      .c1{animation:drop1 3.2s linear infinite;}
      .c2{animation:drop2 2.8s linear infinite; animation-delay:0.4s;}
      .c3{animation:drop3 3.5s linear infinite; animation-delay:1.1s;}
      .c4{animation:drop1 2.5s linear infinite; animation-delay:0.7s;}
      .c5{animation:drop2 3.8s linear infinite; animation-delay:1.5s;}
      .c6{animation:drop3 3.0s linear infinite; animation-delay:0.2s;}
      .c7{animation:drop1 2.7s linear infinite; animation-delay:2.0s;}
      .c8{animation:drop2 3.3s linear infinite; animation-delay:0.9s;}
      .c9{animation:drop3 2.6s linear infinite; animation-delay:1.8s;}
      .c10{animation:drop1 3.6s linear infinite; animation-delay:0.5s;}
      .c11{animation:drop2 2.9s linear infinite; animation-delay:2.3s;}
      .c12{animation:drop3 3.1s linear infinite; animation-delay:1.3s;}
      @keyframes scan { 0%{transform:translateY(0);opacity:0.6} 50%{opacity:0.3} 100%{transform:translateY(160px);opacity:0} }
      .scanline { animation: scan 4s linear infinite; }
      @keyframes fadein { 0%{opacity:0} 40%{opacity:0} 100%{opacity:1} }
      .nametext { animation: fadein 2.5s ease-out forwards; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes slidein { 0%{opacity:0;transform:translateX(-10px)} 60%{opacity:0;transform:translateX(-10px)} 100%{opacity:1;transform:translateX(0)} }
      .subtext { animation: slidein 3.2s ease-out forwards; }
      @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:1} }
      .d1{animation:pulse 2s ease-in-out infinite;}
      .d2{animation:pulse 2s ease-in-out infinite; animation-delay:0.3s;}
      .d3{animation:pulse 2s ease-in-out infinite; animation-delay:0.6s;}
      .d4{animation:pulse 2s ease-in-out infinite; animation-delay:0.9s;}
      .d5{animation:pulse 2s ease-in-out infinite; animation-delay:1.2s;}
      .d6{animation:pulse 2s ease-in-out infinite; animation-delay:1.5s;}
      @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.2} 94%{opacity:1} }
      .corner { animation: flicker 5s ease-in-out infinite; }
    </style>
    <clipPath id="bannerclip">
      <rect width="680" height="160"/>
    </clipPath>
  </defs>

  <rect width="680" height="160" fill="#0d1117"/>

  <g clip-path="url(#bannerclip)" opacity="0.4">
    <text class="rain c1"  x="22"  y="0">1<tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">1</tspan><tspan x="22" dy="14">1</tspan><tspan x="22" dy="14">0</tspan></text>
    <text class="rain c2"  x="50"  y="0">0<tspan x="50" dy="14">1</tspan><tspan x="50" dy="14">0</tspan><tspan x="50" dy="14">1</tspan><tspan x="50" dy="14">1</tspan></text>
    <text class="rain c3"  x="610" y="0">1<tspan x="610" dy="14">1</tspan><tspan x="610" dy="14">0</tspan><tspan x="610" dy="14">0</tspan><tspan x="610" dy="14">1</tspan></text>
    <text class="rain c4"  x="635" y="0">0<tspan x="635" dy="14">1</tspan><tspan x="635" dy="14">1</tspan><tspan x="635" dy="14">0</tspan><tspan x="635" dy="14">1</tspan></text>
    <text class="rain c5"  x="655" y="0">1<tspan x="655" dy="14">0</tspan><tspan x="655" dy="14">0</tspan><tspan x="655" dy="14">1</tspan><tspan x="655" dy="14">0</tspan></text>
    <text class="rain c6"  x="8"   y="0">0<tspan x="8" dy="14">0</tspan><tspan x="8" dy="14">1</tspan><tspan x="8" dy="14">1</tspan><tspan x="8" dy="14">0</tspan></text>
    <text class="rain c7"  x="668" y="0">1<tspan x="668" dy="14">1</tspan><tspan x="668" dy="14">0</tspan><tspan x="668" dy="14">1</tspan><tspan x="668" dy="14">1</tspan></text>
    <text class="rain c8"  x="36"  y="0">1<tspan x="36" dy="14">0</tspan><tspan x="36" dy="14">1</tspan><tspan x="36" dy="14">0</tspan><tspan x="36" dy="14">0</tspan></text>
    <text class="rain c9"  x="622" y="0">0<tspan x="622" dy="14">1</tspan><tspan x="622" dy="14">1</tspan><tspan x="622" dy="14">0</tspan><tspan x="622" dy="14">1</tspan></text>
    <text class="rain c10" x="645" y="0">1<tspan x="645" dy="14">0</tspan><tspan x="645" dy="14">0</tspan><tspan x="645" dy="14">1</tspan><tspan x="645" dy="14">0</tspan></text>
    <text class="rain c11" x="15"  y="0">0<tspan x="15" dy="14">1</tspan><tspan x="15" dy="14">1</tspan><tspan x="15" dy="14">0</tspan><tspan x="15" dy="14">0</tspan></text>
    <text class="rain c12" x="595" y="0">1<tspan x="595" dy="14">0</tspan><tspan x="595" dy="14">1</tspan><tspan x="595" dy="14">1</tspan><tspan x="595" dy="14">0</tspan></text>
  </g>

  <rect class="scanline" x="0" y="0" width="680" height="2" fill="#58a6ff" opacity="0.15"/>

  <g stroke="#1e2d3d" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="53" x2="680" y2="53"/>
    <line x1="0" y1="107" x2="680" y2="107"/>
  </g>

  <rect x="40" y="45" width="3" height="70" fill="#238636" rx="1"/>

  <text class="nametext" x="58" y="90" font-family="monospace" font-size="38" font-weight="700" fill="#e6edf3" letter-spacing="-1">Nir Arazi</text>
  <text class="cursor" x="322" y="90" font-family="monospace" font-size="38" font-weight="700" fill="#238636">_</text>
  <text class="subtext" x="59" y="113" font-family="monospace" font-size="12" fill="#58a6ff" letter-spacing="2">SOC ANALYST  ·  THREAT DETECTION  ·  DFIR</text>

  <circle class="d1" cx="580" cy="60" r="2.5" fill="#238636"/>
  <circle class="d2" cx="592" cy="60" r="2.5" fill="#238636"/>
  <circle class="d3" cx="604" cy="60" r="2.5" fill="#238636"/>
  <circle class="d4" cx="580" cy="100" r="2.5" fill="#58a6ff"/>
  <circle class="d5" cx="592" cy="100" r="2.5" fill="#58a6ff"/>
  <circle class="d6" cx="604" cy="100" r="2.5" fill="#58a6ff"/>

  <g class="corner" stroke="#238636" stroke-width="1.5" fill="none">
    <path d="M40 38 L40 30 L52 30"/>
  </g>
  <g class="corner" stroke="#58a6ff" stroke-width="1.5" fill="none">
    <path d="M640 122 L640 130 L628 130"/>
  </g>
</svg>
